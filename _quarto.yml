project:
  type: website
  output-dir: _site
  pre-render: "node scripts/generate_hashes.js"
  post-render: "node scripts/archive_html.js"
  resources:
    - "versions.json"
    - "archive/"

website:
  title: "Thinghood Limited"
  site-url: "https://thing.rodeo"
  search: false
