project:
  type: website
  output-dir: _site
  pre-render: "node scripts/generate_hashes.js"
  post-render: "node scripts/archive_html.js"
  resources:
    - "versions.json"
    - "cohort_config.json"
    - "archive/"
    - "CNAME"

website:
  title: "Thinghood Limited"
  site-url: "https://study.thing.rodeo"
  search: false
  navbar:
    title-href: "https://thing.rodeo/"
    left:
      - text: "Study"
        href: "https://study.thing.rodeo/"
        target: _self
      - text: "Monism"
        href: "https://thing.rodeo/monism/"
        target: _self
      - text: "Living Syllabus"
        href: "https://thing.rodeo/living-syllabus/"
        target: _self
      - text: "Git"
        href: "https://thing.rodeo/git/"
        target: _self
      - text: "About"
        href: "https://thing.rodeo/about/"
        target: _self
    right:
      - text: "Sign in"
        href: "https://thing.rodeo/#/portal/signin"
        target: _self
      - text: "<span class='nav-subscribe-btn'>Subscribe</span>"
        href: "https://thing.rodeo/#/portal/signup"
        target: _self
  sidebar:
    - id: nf-set-theory
      title: "NF Set Theory"
      contents:
        - nf-set-theory/index.qmd
        - nf-set-theory/01-topology-transclusion.qmd
        - nf-set-theory/02-quine-math-logic.qmd
        - nf-set-theory/03-hailperin-axioms.qmd
        - nf-set-theory/04-specker-orey-jensen.qmd
        - nf-set-theory/05-forster-holmes.qmd
        - nf-set-theory/06-mac-lane-lawvere.qmd
        - nf-set-theory/07-lambek-scott.qmd
        - nf-set-theory/08-mclarty-forster-stratified.qmd
    - id: computation-metalogic
      title: "Computational Metalogic"
      contents:
        - computation-metalogic/index.qmd
        - computation-metalogic/01-conceptual-foundations.qmd
        - computation-metalogic/02-syntax.qmd
        - computation-metalogic/03-deduction.qmd
        - computation-metalogic/04-semantics.qmd
        - computation-metalogic/05-translation.qmd
        - computation-metalogic/06-metalogic.qmd
        - computation-metalogic/07-conclusion.qmd
    - id: material-logics-i
      title: "Material Logics I"
      contents:
        - material-logics-i/index.qmd
        - material-logics-i/01-syntax-material-basis.qmd
        - material-logics-i/02-official-notation-semantics.qmd
        - material-logics-i/03-proof-theory-direct.qmd
        - material-logics-i/04-hypothetical-reasoning.qmd
        - material-logics-i/05-indirect-derivations.qmd
        - material-logics-i/06-normal-forms-machine.qmd
        - material-logics-i/07-dimacs-constraint-mapping.qmd
        - material-logics-i/08-sat-heuristics-synthesis.qmd
    - id: material-logics-ii
      title: "Material Logics II"
      contents:
        - material-logics-ii/index.qmd
        - material-logics-ii/01-propositional-to-quantified.qmd
        - material-logics-ii/02-definite-descriptions.qmd
        - material-logics-ii/03-tarskian-semantics.qmd
        - material-logics-ii/04-model-checking-counter.qmd
        - material-logics-ii/05-natural-deduction-quantified.qmd
        - material-logics-ii/06-relational-logic-identity.qmd
        - material-logics-ii/07-metatheory-transition-lean4.qmd
        - material-logics-ii/08-formalization-portfolio.qmd

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    include-in-header:
      - text: |
          <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://api.github.com https://tl-study-relay.ryann.workers.dev; object-src 'none';">
          <meta name="referrer" content="no-referrer">
          <script src="/js/cohort.js"></script>
          <script src="/js/priority-nav.js"></script>
          <script src="/js/home-cohorts.js"></script>
    include-after-body:
      - text: |
          <script>
            document.addEventListener("DOMContentLoaded", function() {
              var brand = document.querySelector(".navbar-brand");
              if (brand) brand.href = "https://thing.rodeo/";
            });
          </script>